name: Metro Recorder APK

on:
  push:
    paths:
      - "metro-recorder/**"
      - ".github/workflows/metro-recorder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metro-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "MetroRecorder-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MetroRecorder-${{ github.run_number }}
          path: metro-recorder/MetroRecorder-*.apk
          if-no-files-found: error
